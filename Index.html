<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
  </head>

  <body>
    <header>
      <h1>✨ AI Poem Generator ✨</h1>
      <p>Every topic has a poem waiting to be written.</p>
    </header>

    <main>
      <form id="poem-form">
        <input
          type="text"
          id="topic"
          placeholder="Enter a topic, e.g. the ocean"
          autocomplete="off"
          required
        />
        <button type="submit">Generate Poem ✨</button>
      </form>

      <div id="poem" class="poem">
        Your poem will appear here... 🌸
      </div>
    </main>

    <footer>
      Coded by Chandrika Rajkumar
    </footer>

    <script src="index.js"></script>
  </body>
</html>
